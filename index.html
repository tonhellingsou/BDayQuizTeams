<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sir Tony's Ultimate Bday Quiz Battle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #f3f3f3; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .page-container { 
      max-width: 600px; margin: 3rem auto; padding: 2rem; background: #fff0d1; 
      border: 1px solid #d8dbe0; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,.04); box-sizing: border-box;
    }
    @media (max-width: 600px) { .page-container { margin: 1rem; padding: 1.5rem; } }
    .field-card { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: .4rem; font-weight: 600; }
    input[type="text"] { 
      width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #d8dbe0; 
      border-radius: 8px; background: #f9fafb; box-sizing: border-box; 
    }
    input[type="text"]:focus { background: #fff; outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25); }
    .btn-primary { 
      width: 100%; padding: 1rem; border-radius: 10px; border: none; 
      background: #2563eb; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
    
    .color-box { padding: 2rem; text-align: center; border-radius: 12px; margin: 1.5rem 0; color: white; font-size: 1.5rem; font-weight: bold; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
    .bg-red { background-color: #ef4444; }
    .bg-blue { background-color: #3b82f6; }
    .bg-green { background-color: #22c55e; }
    .bg-yellow { background-color: #eab308; color: #000; }
    
    .hidden { display: none; }
    .muted { color: #666; font-size: 0.95rem; }
    .team-list { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px;}
    .team-list li { padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
    .team-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <!-- REGISTRATION FORM -->
  <div class="page-container" id="form-section">
    <!-- Image placeholder -->
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <img src="Logo.jpg" alt="Event Cover" style="max-width: 100%; height: auto; border-radius: 8px;">
    </div>
    
    <h1 style="margin-top: 0; text-align: center;">Are you ready for Sir Tony's Ultimate Quiz Battle?</h1>
    <p class="muted" style="text-align: center; margin-bottom: 2rem;">Fill in your name and think of an amazing team name!</p>
    
    <div class="field-card">
      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="E.g. Britney Jean Spears">
    </div>
    <div class="field-card">
      <label for="teamName">Proposed Team Name</label>
      <input type="text" id="teamName" placeholder="E.g. The Lovely Sisterhood of Eternal Doom">
    </div>
    <button id="submit-btn" class="btn-primary">Join</button>
  </div>

  <!-- DASHBOARD / REFRESH VIEW -->
  <div class="page-container hidden" id="dashboard-section">
    <h2 style="margin-top: 0; text-align: center;">Welcome, <span id="display-name"></span>!</h2>
    <p style="text-align: center; margin-top: 0;">Your team name idea: <strong id="display-team"></strong></p>
    
    <div id="color-display" class="color-box">
      You are on the <span id="display-color-text"></span> team
    </div>

    <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 2rem 0;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h3 style="margin: 0;">Event Overview</h3>
      <button id="refresh-btn" style="padding: 0.4rem 0.8rem; background: #e5e7eb; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">↻ Refresh</button>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2rem;">
      <!-- Column 1: Your Team's Proposed Names -->
      <div>
        <h4 style="margin-top: 0;">Ideas for <span id="dynamic-team-color-label"></span></h4>
        <ul class="team-list" id="dynamic-team-list">
          <li>Loading...</li>
        </ul>
      </div>

      <!-- Column 2: Assigned Members -->
      <div>
        <h4 style="margin-top: 0;">Assigned Teams</h4>
        <div id="dynamic-members-list" style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem;">
          Loading...
        </div>
      </div>
    </div>
  </div>

  <script>
// --- IMPORTANT: PASTE YOUR APP SCRIPT URL HERE ---
    const WEBHOOK = "https://script.google.com/macros/s/AKfycbxDCjMCjsAlKosFysiDDw5Y8T-705IZAQmd68_eMrP6dAbWjekV59U5VCfkCLvDi6vJ/exec";
    const colorHex = { "Red": "#ef4444", "Blue": "#3b82f6", "Green": "#22c55e", "Yellow": "#ca8a04" };

    const formSection = document.getElementById('form-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const submitBtn = document.getElementById('submit-btn');
    const refreshBtn = document.getElementById('refresh-btn');

    let userData = JSON.parse(localStorage.getItem('teamEventData'));
    if (userData) {
      showDashboard(userData);
    }

    submitBtn.addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim();
      const teamName = document.getElementById('teamName').value.trim();

      if (!name || !teamName) return alert("Please fill in both fields.");

      submitBtn.disabled = true;
      submitBtn.textContent = "Assigning Color...";

      const userId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2);

      try {
        const res = await fetch(WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: "register", userId, name, teamName })
        });
        const data = await res.json();
        
        if (data.success) {
          userData = { name, teamName, color: data.color };
          localStorage.setItem('teamEventData', JSON.stringify(userData)); 
          showDashboard(userData);
        } else {
          // BEVEILIGING: Laat een error zien als de naam al bestaat in de sheet
          alert(data.message || "Er is een fout opgetreden bij het aanmelden.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Join & Get Color";
        }
      } catch (e) {
        alert("Error submitting data. Please try again.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Join & Get Color";
      }
    });

    refreshBtn.addEventListener('click', fetchTeams);

    function showDashboard(data) {
      formSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');

      document.getElementById('display-name').textContent = data.name;
      document.getElementById('display-team').textContent = data.teamName;
      
      const colorBox = document.getElementById('color-display');
      colorBox.className = "color-box bg-" + data.color.toLowerCase();
      document.getElementById('display-color-text').textContent = data.color;
      
      const teamLabel = document.getElementById('dynamic-team-color-label');
      teamLabel.textContent = data.color + " Team";
      teamLabel.style.color = colorHex[data.color];

      fetchTeams();
    }

    async function fetchTeams() {
      if (!userData) return;
      const list = document.getElementById('dynamic-team-list');
      const membersContainer = document.getElementById('dynamic-members-list');
      refreshBtn.textContent = "↻ ...";
      
      try {
        const res = await fetch(WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: "getTeams" })
        });
        const responseData = await res.json();
        
        if (responseData.success) {
          const allData = responseData.data;
          
          list.innerHTML = "";
          const myTeamIdeas = allData[userData.color].teams;
          
          if (myTeamIdeas.length === 0) {
            list.innerHTML = "<li>No teams proposed yet.</li>";
          } else {
            myTeamIdeas.forEach(t => {
              const li = document.createElement('li');
              li.textContent = t;
              li.style.color = colorHex[userData.color];
              li.style.fontWeight = "bold";
              list.appendChild(li);
            });
          }

          membersContainer.innerHTML = "";
          const colors = ["Red", "Blue", "Green", "Yellow"];

          colors.forEach(color => {
            const teamDiv = document.createElement('div');
            teamDiv.style.marginBottom = "1rem";
            
            const header = document.createElement('h5');
            header.style.margin = "0 0 0.5rem 0";
            header.style.color = colorHex[color];
            header.textContent = color + " Team";
            teamDiv.appendChild(header);

            const ul = document.createElement('ul');
            ul.style.margin = "0";
            ul.style.paddingLeft = "1.5rem";

            const membersList = allData[color].members;
            if (membersList && membersList.length > 0) {
              membersList.forEach(m => {
                const li = document.createElement('li');
                li.textContent = m;
                li.style.fontSize = "0.95rem";
                ul.appendChild(li);
              });
            } else {
              const li = document.createElement('li');
              li.textContent = "Waiting for players...";
              li.style.fontSize = "0.9rem";
              li.style.color = "#9ca3af";
              li.style.fontStyle = "italic";
              ul.appendChild(li);
            }
            
            teamDiv.appendChild(ul);
            membersContainer.appendChild(teamDiv);
          });
        }
      } catch (e) {
        list.innerHTML = "<li>Failed to load data.</li>";
        membersContainer.innerHTML = "Failed to load teams.";
      } finally {
        refreshBtn.textContent = "↻ Refresh";
      }
    }
  </script>
</body>
</html>
